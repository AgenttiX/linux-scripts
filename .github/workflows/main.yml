name: CI
on: push
env:
  PYTHON_VERSION: 3.14
jobs:
  fossa:
    runs-on: ubuntu-slim
    steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Print Python version
      run: python -V
    - name: Checkout
      uses: actions/checkout@v7
    - name: Load pip cache
      uses: actions/cache@v6
      with:
        path: .pip
        key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-
          pip-
    - name: Install apt requirements
      run: |
        sudo apt-get update
        sudo apt-get install gcc libssl-dev python3-dev swig
    - name: Install requirements
      run: |
        pip --cache-dir=.pip install --upgrade pip
        pip --cache-dir=.pip install -r requirements.txt
    - name: Install FOSSA
      run: |
        curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | sudo bash
    - name: Run FOSSA
      run: fossa analyze
      env:
        FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Print Python version
        run: python -V
      - name: Checkout
        uses: actions/setup-python@v7
      - name: Load pip cache
        uses: actions/cache@v6
        with:
          path: .pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
            pip-
      - name: Install requirements
        run: |
          pip --cache-dir=.pip install --upgrade pip
          pip --cache-dir=.pip install -r requirements.txt
      - name: Lint with ruff
        uses: astral-sh/ruff-action@v4.1.0
        args: check --exit-zero
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Lint
          path: ruff.txt
          if-no-files-found: error
  sast:
    # The SAST scanner action is based on Docker, and therefore does not work on ubuntu-slim.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - uses: AppThreat/sast-scan-action@master
      with:
        type: bash,python
    - uses: actions/upload-artifact@v7
      with:
        name: reports
        path: reports
        if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Print Python version
      run: python -V
    - name: Checkout
      uses: actions/checkout@v7
    - name: Load pip cache
      uses: actions/cache@v6
      with:
        path: .pip
        key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          pip-${{ runner.os }}-
          pip-
    - name: Install apt requirements
      run: sudo apt-get install gcc libssl-dev python3-dev swig
    - name: Install requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y bleachbit chkrootkit fwupd rkhunter modemmanager
        pip --cache-dir=.pip install --upgrade pip
        pip --cache-dir=.pip install -r requirements.txt
    - name: Run tests
      run: |
        set -o pipefail
        pytest | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      with:
        name: Coverage
        path: |
         .test_durations
          coverage.xml
          coverage.json
          htmlcov
          test-output.txt
        if-no-files-found: error
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
