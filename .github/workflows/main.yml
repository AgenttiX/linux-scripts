name: CI
on: push
env:
  PYTHON_VERSION: 3.14
jobs:
  fossa:
    runs-on: ubuntu-slim
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10
    - name: Export requirements for FOSSA
      # FOSSA analyzes the dependencies from requirements.txt, which is generated from uv.lock.
      run: uv export --locked --format requirements.txt --no-hashes --output-file requirements.txt
    - name: Install FOSSA
      run: |
        curl -H 'Cache-Control: no-cache' https://raw.githubusercontent.com/fossas/fossa-cli/master/install.sh | sudo bash
    - name: Run FOSSA
      run: fossa analyze
      env:
        FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install requirements
        run: uv sync --locked
      - name: Print Python version
        run: uv run --locked python -V
      - name: Run Ruff
        run: uv run --locked ruff check --output-format=full 2>&1 | tee ruff.txt
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Lint
          path: ruff.txt
          if-no-files-found: error
  sast:
    # The SAST scanner action is based on Docker and therefore does not work on ubuntu-slim.
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - uses: AppThreat/sast-scan-action@master
      with:
        type: bash,python
    - uses: actions/upload-artifact@v7
      with:
        name: reports
        path: reports
        if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Setup uv
      uses: astral-sh/setup-uv@v10
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        enable-cache: true
    - name: Install apt requirements
      run: |
        sudo apt-get update
        sudo apt-get install -y bleachbit chkrootkit fwupd rkhunter modemmanager zsh
    - name: Install requirements
      run: uv sync --locked
    - name: Print Python version
      run: uv run --locked python -V
    - name: Run tests
      run: |
        set -o pipefail
        uv run --locked pytest | tee test-output.txt
    - name: Upload results
      uses: actions/upload-artifact@v7
      with:
        name: Coverage
        path: |
          coverage.xml
          coverage.json
          htmlcov
          test-output.txt
        if-no-files-found: error
    - name: Upload results to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
