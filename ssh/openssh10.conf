# SSH configuration that requires OpenSSH 10.0 or newer.
# OpenSSH refuses the entire configuration if it contains a Match keyword it does not know,
# even if the keyword is in an inactive block or in an included file.
# Therefore, this file is not in config.d/,
# and setup_ssh.sh links it to ~/.ssh/openssh10.conf only on the systems where it is supported.

# OpenSSH refuses to run if there is both a RemoteCommand and a command on the command line.
# Therefore, apply the RemoteCommand and its RequestTTY only to interactive sessions,
# so that "ssh host command", rsync and the OpenSSH backend of JetBrains IDEs work for the same hosts.
# This must be included before the options it overrides, since the first obtained value of an option is used.
Match sessiontype exec,subsystem,none
    RemoteCommand none
    RequestTTY auto
