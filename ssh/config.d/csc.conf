# CSC servers

Host lumi mahti puhti roihu-cpu roihu-gpu
    User mikamaki
    ForwardAgent yes
    PasswordAuthentication no
    ForwardX11 yes

# Only for the clients that run "Match exec" in a POSIX shell, i.e. not Microsoft OpenSSH,
# which may be older than 10.0 and therefore cannot disable the RemoteCommand for non-interactive sessions.
# See the "Compatibility" section of the main SSH config and openssh10.conf.
Match host lumi,mahti,puhti,roihu-cpu,roihu-gpu exec "test $0 != '$0'"
    RequestTTY yes
    RemoteCommand command -v tmux >/dev/null && (tmux has-session && tmux set-environment SSH_AUTH_SOCK "$SSH_AUTH_SOCK" \; attach-session || tmux new-session)

Host lumi
    HostName lumi.csc.fi

Host mahti
    HostName mahti.csc.fi

Host puhti
    HostName puhti.csc.fi

Host roihu-cpu
    HostName roihu-cpu.csc.fi
    # CertificateFile ~/.ssh/example-cert.pub

Host roihu-gpu
    HostName roihu-gpu.csc.fi
    # CertificateFile ~/.ssh/example-cert.pub
