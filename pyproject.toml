[project]
name = "linux-scripts"
version = "0.1.0"
description = "A collection of GNU/Linux scripts"
readme = "README.md"
license = "MIT"
keywords = [
    "GNU/Linux",
    "Linux",
    "script",
    "scripts"
]
authors = [
    {name = "Mika Mäki"}
]
maintainers = [
    {name = "Mika Mäki"}
]
classifiers = [
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Unix Shell",
    "Topic :: Desktop Environment",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security",
    "Topic :: Software Development",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Topic :: Utilities",
    "Typing :: Typed"
]
dependencies = [
    # Python-ADB may require the following to work:
    # sudo apt install gcc libssl-dev python3-dev python3-m2crypto python3-openssl python3-rsa swig
    # This does not work on Ubuntu 22.04
    # "adb>=1.3.0",
    # "chkcrontab>=1.7",
    "exif>=1.6.0",
    # gplaycli >= 3.29
    # This does not work on Ubuntu 22.04
    # https://github.com/rehmatworks/gplaydl/issues/30
    # "gplaydl>=1.3.5",
    # TODO: Try this instead.
    # https://github.com/89z/googleplay
    # For Wacom script
    # Despite the warning from FOSSA, python-xlib is licensed with LGPLv2+
    # https://github.com/python-xlib/python-xlib
    # https://pypi.org/project/python-xlib/
    "python-xlib>=0.33",
    # "qmk>=1.0.0",
    "requests>=2.32.3",
    "slack-cleaner2>=3.2.7",  # For LibreNMS log spam cleaner
    # "tasmotizer>=1.2.1",
]
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[project.urls]
Repository = "https://github.com/AgenttiX/linux-scripts"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]
show_missing = true

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
addopts = [
    "--cov",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--durations=10",
    "--durations-min=1.0"
]
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C4",    # flake8-comprehensions
    "D",     # pydocstyle
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "NPY",   # NumPy-specific rules
    "PERF",  # Perflint
    "PIE",   # flake8-pie
    "PL",    # Pylint
    "PT",    # flake8-pytest-style
    "RET",   # flake8-return
    "RUF",   # Ruff-specific rules
    "SIM",   # flake8-simplify
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W"      # pycodestyle warnings
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.uv]
# This repository is a collection of scripts, not an installable package.
package = false
